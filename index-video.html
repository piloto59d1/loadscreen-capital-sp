<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capital Roleplay — Carregando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --vermelho: #ff2d2d;
        --vermelho-escuro: #7a0000;
        --branco: #fff;
    }

    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
        background: #000;
        user-select: none;
        color: #fff;
    }

    /* ============ VÍDEO DE FUNDO ============ */
    .fundo-video {
        position: fixed; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        z-index: 0;
        animation: fadeZoom 1.4s ease-out both;
    }
    @keyframes fadeZoom {
        0%   { opacity: 0; transform: scale(1.1); filter: blur(6px); }
        100% { opacity: 1; transform: scale(1);   filter: blur(0); }
    }

    /* Gradiente inferior pra leitura da UI + vinheta */
    .overlay {
        position: fixed; inset: 0; z-index: 2; pointer-events: none;
        background:
            linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.25) 28%, transparent 50%),
            radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.5) 100%);
        opacity: 0; animation: fadeSuave 1.6s ease-out 0.3s both;
    }
    @keyframes fadeSuave { 0%{opacity:0;} 100%{opacity:1;} }

    /* Cantos decorativos (moldura sutil) */
    .canto { position: fixed; z-index: 5; width: 60px; height: 60px; pointer-events: none; opacity: 0; animation: fadeSuave 1s ease-out 1.6s both; }
    .canto.tl { top: 26px; left: 26px;  border-top: 2px solid rgba(255,45,45,0.6); border-left: 2px solid rgba(255,45,45,0.6); }
    .canto.tr { top: 26px; right: 26px; border-top: 2px solid rgba(255,45,45,0.6); border-right: 2px solid rgba(255,45,45,0.6); }
    .canto.bl { bottom: 26px; left: 26px;  border-bottom: 2px solid rgba(255,45,45,0.6); border-left: 2px solid rgba(255,45,45,0.6); }
    .canto.br { bottom: 26px; right: 26px; border-bottom: 2px solid rgba(255,45,45,0.6); border-right: 2px solid rgba(255,45,45,0.6); }

    /* ============ BLOCO DE CARREGAMENTO (inferior central) ============ */
    .carregamento {
        position: fixed; z-index: 12;
        bottom: 60px; left: 50%; transform: translateX(-50%);
        width: min(680px, 74vw); text-align: center;
        animation: subir 0.9s cubic-bezier(.2,.9,.3,1) 0.5s both;
    }
    @keyframes subir {
        0%   { opacity: 0; transform: translateX(-50%) translateY(40px); }
        100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* Texto de status (cicla) */
    .status {
        height: 22px; margin-bottom: 14px;
        font-size: 14px; font-weight: 600; letter-spacing: 3px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.82);
        text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        transition: opacity .4s ease, transform .4s ease;
    }
    .status.trocando { opacity: 0; transform: translateY(-6px); }

    /* Barra */
    .barra-fundo {
        position: relative;
        width: 100%; height: 6px;
        background: rgba(255,255,255,0.08);
        border-radius: 999px; overflow: hidden;
        box-shadow: inset 0 0 12px rgba(0,0,0,0.6);
    }
    .barra {
        position: relative;
        height: 100%; width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--vermelho-escuro), var(--vermelho), #ff7a7a);
        background-size: 200% 100%;
        animation: correr 2s linear infinite;
        box-shadow: 0 0 18px rgba(255,45,45,0.8), 0 0 40px rgba(255,45,45,0.35);
        transition: width .5s ease;
    }
    /* Brilho que desliza sobre a barra */
    .barra::after {
        content: ''; position: absolute; top: 0; left: -40%;
        width: 40%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
        animation: brilho 1.8s ease-in-out infinite;
    }
    @keyframes brilho { 0%{left:-40%;} 60%,100%{left:120%;} }
    @keyframes correr { 0%{background-position:0% 0;} 100%{background-position:200% 0;} }

    /* Linha de baixo: % + nome do recurso */
    .info-baixo {
        display: flex; justify-content: space-between; align-items: center;
        margin-top: 12px;
    }
    .recurso {
        font-size: 12px; letter-spacing: 1.5px; font-weight: 500;
        color: rgba(255,255,255,0.55);
        text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        transition: opacity .35s ease;
    }
    .porcentagem {
        font-family: 'Bebas Neue', 'Rajdhani', sans-serif;
        font-size: 30px; line-height: 1; letter-spacing: 1px;
        color: #fff;
        text-shadow: 0 0 16px rgba(255,45,45,0.7), 0 2px 6px rgba(0,0,0,0.9);
    }
    .porcentagem span { color: var(--vermelho); }

    /* ============ MENSAGEM DE BOAS-VINDAS (rotativa) ============ */
    .welcome {
        position: fixed; z-index: 11;
        bottom: 150px; left: 50%; transform: translateX(-50%);
        text-align: center; width: min(700px, 80vw);
        animation: subir 0.9s cubic-bezier(.2,.9,.3,1) 0.8s both;
    }
    .welcome .frase {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 22px; letter-spacing: 2px;
        color: rgba(255,255,255,0.9);
        text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        transition: opacity .5s ease, transform .5s ease;
    }
    .welcome .frase.trocando { opacity: 0; transform: translateY(8px); }
    .welcome .sub {
        margin-top: 4px;
        font-size: 12px; letter-spacing: 4px; font-weight: 600;
        text-transform: uppercase;
        color: rgba(255,45,45,0.85);
    }

    /* ============ REDE SOCIAL (canto inferior esquerdo) ============ */
    .social {
        position: fixed; z-index: 12;
        bottom: 30px; left: 34px;
        display: flex; flex-direction: column; gap: 10px;
        animation: entrarEsq 0.8s cubic-bezier(.2,.9,.3,1) 1.1s both;
    }
    @keyframes entrarEsq { 0%{opacity:0; transform:translateX(-40px);} 100%{opacity:1; transform:translateX(0);} }
    .social a {
        display: flex; align-items: center; gap: 10px;
        text-decoration: none; color: rgba(255,255,255,0.9);
        background: rgba(15,2,2,0.6);
        border: 1px solid rgba(255,60,60,0.4);
        padding: 9px 15px; border-radius: 10px;
        backdrop-filter: blur(8px);
        font-size: 13px; font-weight: 600; letter-spacing: 1px;
        transition: transform .25s ease, border-color .25s ease, background .25s ease;
    }
    .social a:hover {
        transform: translateX(6px);
        border-color: var(--vermelho);
        background: rgba(40,4,4,0.75);
    }
    .social a .ic {
        width: 20px; height: 20px; display: grid; place-items: center;
        color: var(--vermelho); font-size: 15px;
    }

    /* ============ TOCAR MÚSICA (canto inferior direito) ============ */
    .musica {
        position: fixed; z-index: 12;
        bottom: 30px; right: 34px;
        display: flex; align-items: center; gap: 10px;
        background: rgba(15,2,2,0.6);
        border: 1px solid rgba(255,60,60,0.4);
        padding: 9px 14px; border-radius: 10px;
        backdrop-filter: blur(8px);
        animation: entrarDir 0.8s cubic-bezier(.2,.9,.3,1) 1.2s both;
    }
    @keyframes entrarDir { 0%{opacity:0; transform:translateX(40px);} 100%{opacity:1; transform:translateX(0);} }
    .musica button {
        background: none; border: none; cursor: pointer;
        font-size: 17px; color: #fff;
    }
    .musica input[type=range] { width: 80px; accent-color: var(--vermelho); cursor: pointer; }
    .nota { animation: girar 3s linear infinite; display: inline-block; }
    @keyframes girar { 0%{transform:rotate(0);} 100%{transform:rotate(360deg);} }

    /* ============ TOPO: marca d'água sutil ============ */
    .topo-marca {
        position: fixed; z-index: 11;
        top: 34px; left: 50%; transform: translateX(-50%);
        text-align: center;
        animation: fadeSuave 1s ease-out 1.4s both;
    }
    .topo-marca .nome {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 26px; letter-spacing: 8px;
        color: rgba(255,255,255,0.92);
        text-shadow: 0 2px 12px rgba(0,0,0,0.9), 0 0 20px rgba(255,45,45,0.3);
    }
    .topo-marca .linha {
        margin: 6px auto 0; width: 60%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,45,45,0.8), transparent);
    }
</style>
</head>
<body>

    <!-- ARTE OFICIAL: vídeo animado Capital Roleplay -->
    <video class="fundo-video" autoplay loop muted playsinline>
        <source src="fundo-2min.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <!-- Moldura de cantos -->
    <div class="canto tl"></div>
    <div class="canto tr"></div>
    <div class="canto bl"></div>
    <div class="canto br"></div>

    <!-- Marca no topo -->
    <div class="topo-marca">
        <div class="nome">CAPITAL ROLEPLAY</div>
        <div class="linha"></div>
    </div>

    <!-- Mensagem de boas-vindas rotativa -->
    <div class="welcome">
        <div class="frase" id="frase">SEJA BEM-VINDO AO NOSSO MUNDO</div>
        <div class="sub">Carregando sua experiência</div>
    </div>

    <!-- Bloco de carregamento -->
    <div class="carregamento">
        <div class="status" id="status">Conectando ao servidor</div>
        <div class="barra-fundo"><div class="barra" id="barra"></div></div>
        <div class="info-baixo">
            <div class="recurso" id="recurso">inicializando...</div>
            <div class="porcentagem"><span id="porcentagem">0</span>%</div>
        </div>
    </div>

    <!-- Redes sociais -->
    <div class="social">
        <a href="https://discord.gg/SwUFVH6r3" target="_blank" rel="noopener">
            <span class="ic">💬</span> discord.gg/SwUFVH6r3
        </a>
    </div>

    <!-- Música -->
    <div class="musica">
        <span class="nota">🎵</span>
        <button id="btnSom" title="Ligar/desligar som">🔊</button>
        <input type="range" id="volume" min="0" max="100" value="40">
    </div>

    <!-- MÚSICA: coloque um arquivo musica.mp3 nesta pasta! -->
    <audio id="musica" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

<script>
    // ===== Música =====
    const musica = document.getElementById('musica');
    const btnSom = document.getElementById('btnSom');
    const volume = document.getElementById('volume');
    musica.volume = 0.4;
    const tocar = () => musica.play().catch(() => {});
    tocar();
    document.addEventListener('click', tocar, { once: true });
    btnSom.onclick = () => {
        musica.muted = !musica.muted;
        btnSom.textContent = musica.muted ? '🔇' : '🔊';
    };
    volume.oninput = () => { musica.volume = volume.value / 100; musica.muted = false; btnSom.textContent = '🔊'; };

    // ===== Status que cicla =====
    const statusEl = document.getElementById('status');
    const recursoEl = document.getElementById('recurso');
    const listaStatus = [
        'Conectando ao servidor',
        'Carregando mapas',
        'Sincronizando jogadores',
        'Preparando veículos',
        'Carregando scripts',
        'Otimizando recursos',
        'Quase pronto'
    ];
    const listaRecursos = [
        'capital_core', 'capital_vehicles', 'capital_housing',
        'capital_jobs', 'capital_garage', 'capital_hud',
        'capital_bank', 'capital_police', 'capital_medical'
    ];
    let idxStatus = 0;
    function trocarStatus() {
        statusEl.classList.add('trocando');
        setTimeout(() => {
            idxStatus = (idxStatus + 1) % listaStatus.length;
            statusEl.textContent = listaStatus[idxStatus];
            recursoEl.textContent = listaRecursos[Math.floor(Math.random() * listaRecursos.length)];
            statusEl.classList.remove('trocando');
        }, 400);
    }
    setInterval(trocarStatus, 2600);

    // ===== Mensagens de boas-vindas rotativas =====
    const fraseEl = document.getElementById('frase');
    const frases = [
        'SEJA BEM-VINDO AO NOSSO MUNDO',
        'RESPEITO É A BASE DE TUDO',
        'DEUS NO COMANDO SEMPRE',
        'A CITY MAIS DIFFERENTE DO BRASIL',
        'BOA JOGADA, BOA HISTORIA'
    ];
    let idxFrase = 0;
    setInterval(() => {
        fraseEl.classList.add('trocando');
        setTimeout(() => {
            idxFrase = (idxFrase + 1) % frases.length;
            fraseEl.textContent = frases[idxFrase];
            fraseEl.classList.remove('trocando');
        }, 500);
    }, 5000);

    // ===== Barra de progresso =====
    const barra = document.getElementById('barra');
    const porcentagem = document.getElementById('porcentagem');
    let progresso = 0;
    (function avancar() {
        const restante = 97 - progresso;
        progresso += Math.random() * (restante * 0.07) + 0.4;
        if (progresso > 97) progresso = 97;
        const v = Math.floor(progresso);
        barra.style.width = v + '%';
        porcentagem.textContent = v;
        setTimeout(avancar, 320 + Math.random() * 480);
    })();
</script>
</body>
</html>
