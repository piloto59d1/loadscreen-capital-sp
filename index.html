<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capital Roleplay — Carregando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
 * { margin: 0; padding: 0; box-sizing: border-box; }

 html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  user-select: none;
  color: #fff;
  font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
 }

 /* ===== VÍDEO (arte Capital) em tela cheia ===== */
 .fundo-video {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: 0;
 }

 /* Gradiente bem sutil só na borda de baixo (pra ler o texto) */
 .overlay {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 18%);
 }

 /* ===== BARRA ULTRA FINA na borda de baixo ===== */
 .barra-fundo {
  position: fixed; z-index: 12;
  bottom: 0; left: 0;
  width: 100%; height: 3px;
  background: rgba(255,255,255,0.08);
 }
 .barra {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #8b0000, #ff2d2d);
  box-shadow: 0 0 10px rgba(255,45,45,0.8);
  transition: width .4s ease;
 }
</style>
</head>
<body>

 <video class="fundo-video" autoplay loop muted playsinline>
  <source src="fundo.mp4" type="video/mp4">
  <source src="fundo-2min.mp4" type="video/mp4">
 </video>

 <div class="overlay"></div>

 <div class="barra-fundo"><div class="barra" id="barra"></div></div>

 <audio id="musica" loop>
  <source src="musica.mp3" type="audio/mpeg">
 </audio>

<script>
 // Detecta FiveM
 const noFiveM = typeof window.invokeNative === 'function';

 // Música (toca só se existir musica.mp3, sem botão)
 const musica = document.getElementById('musica');
 musica.volume = 0.4;
 const tocar = () => musica.play().catch(() => {});
 tocar();
 document.addEventListener('click', tocar, { once: true });

 // Barra de progresso
 const barra = document.getElementById('barra');
 let progresso = 0;
 let finalizado = false;

 function definirProgresso(v) {
  v = Math.max(0, Math.min(100, v));
  progresso = v;
  barra.style.width = v + '%';
 }

 // Progresso real do FiveM
 window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.event === 'loadProgress' && typeof d.loadFraction === 'number') {
   definirProgresso(d.loadFraction * 100);
   if (d.loadFraction >= 1) finalizar();
  }
 });

 function finalizar() {
  if (finalizado) return;
  finalizado = true;
  definirProgresso(100);
  if (noFiveM) {
   try { window.invokeNative('0xA13C11E1B5C06E73'); } catch (err) {}
  }
 }

 // Simulação (fora do FiveM)
 if (!noFiveM) {
  (function avancar() {
   if (finalizado) return;
   const restante = 97 - progresso;
   progresso += Math.random() * (restante * 0.07) + 0.4;
   if (progresso > 97) progresso = 97;
   definirProgresso(progresso);
   setTimeout(avancar, 320 + Math.random() * 480);
  })();
 }
</script>
</body>
</html>
