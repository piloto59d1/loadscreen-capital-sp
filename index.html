<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capital SP — Carregando</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #050101;
        user-select: none;
        color: #fff;
    }

    /* ============ ARTE DE FUNDO ============ */
    /* Usa fundo.jpg se existir; senão, a arte vetorial grunge que vem junto */
    .fundo {
        position: fixed; inset: -4%;   /* margem pro zoom não vazar borda */
        background-image: url('fundo.jpg'), url('fundo.svg');
        background-size: cover, cover;
        background-position: center, center;
        z-index: 0;
        animation: kenburns 40s ease-in-out infinite alternate;
    }
    /* Zoom cinematográfico lento */
    @keyframes kenburns {
        0%   { transform: scale(1) translate(0, 0); }
        100% { transform: scale(1.09) translate(-1%, -1.2%); }
    }

    /* Fundo reserva (se a imagem não existir) */
    .reserva {
        position: fixed; inset: 0; z-index: -1;
        background: radial-gradient(ellipse at 50% 100%, #2a0505 0%, #050101 70%);
    }

    /* Vinheta pra dar profundidade */
    .vinheta {
        position: fixed; inset: 0; z-index: 3; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(10, 0, 0, 0.6) 100%);
    }

    /* ============ NEBLINA ============ */
    .neblina {
        position: fixed; z-index: 2;
        width: 60vw; height: 40vh;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(255, 40, 40, 0.08), transparent 70%);
        filter: blur(30px);
        pointer-events: none;
    }
    .neblina.n1 { top: 55%; left: -20vw; animation: neblinar1 26s ease-in-out infinite alternate; }
    .neblina.n2 { top: 20%; right: -25vw; animation: neblinar2 34s ease-in-out infinite alternate; }
    @keyframes neblinar1 { 0% {transform: translateX(0);} 100% {transform: translateX(45vw);} }
    @keyframes neblinar2 { 0% {transform: translateX(0);} 100% {transform: translateX(-40vw);} }

    /* ============ LUZES PISCANDO ============ */
    .luz {
        position: fixed; z-index: 2;
        border-radius: 50%;
        pointer-events: none;
        animation: piscar linear infinite;
    }
    @keyframes piscar {
        0%, 100% { opacity: 0.1; }
        50%      { opacity: 1; }
    }

    /* ============ HELICÓPTERO ============ */
    .heli {
        position: fixed; z-index: 4;
        top: 12%; left: 0;
        width: 90px;
        opacity: 0;
        animation: voar 22s linear infinite;
        animation-delay: 4s;
        pointer-events: none;
    }
    @keyframes voar {
        0%   { transform: translate(-15vw, 0); opacity: 0; }
        4%   { opacity: 1; }
        50%  { transform: translate(48vw, -4vh); }
        96%  { opacity: 1; }
        100% { transform: translate(115vw, -7vh); opacity: 0; }
    }
    .heli .luz-heli {
        position: absolute; bottom: 2px; left: 50%;
        width: 5px; height: 5px; border-radius: 50%;
        background: #ff2222;
        box-shadow: 0 0 8px #ff2222;
        animation: piscar 1s linear infinite;
    }

    /* ============ REFLEXO NO CARRO ============ */
    .reflexo {
        position: fixed; z-index: 3;
        bottom: 8%; left: -30%;
        width: 45%; height: 35%;
        background: linear-gradient(105deg, transparent 30%, rgba(255, 60, 60, 0.10) 50%, transparent 70%);
        transform: skewX(-15deg);
        animation: varrer 9s ease-in-out infinite;
        pointer-events: none;
    }
    @keyframes varrer {
        0%, 100% { transform: translateX(0) skewX(-15deg); }
        50%      { transform: translateX(60%) skewX(-15deg); }
    }

    /* ============ BARRA DE CARREGAMENTO ============ */
    .area-loading {
        position: fixed; z-index: 12;
        bottom: 12.5vh; left: 50%; transform: translateX(-50%);
        width: min(500px, 60vw); text-align: center;
    }
    .barra-fundo {
        width: 100%; height: 9px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 999px; overflow: hidden;
        border: 1px solid rgba(255, 60, 60, 0.45);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
    }
    .barra {
        height: 100%; width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #5c0000, #d90000, #ff5c5c);
        background-size: 200% 100%;
        animation: correr 1.6s linear infinite;
        box-shadow: 0 0 16px rgba(217, 0, 0, 0.9);
        transition: width .4s ease;
    }
    @keyframes correr { 0% {background-position:0% 0;} 100% {background-position:200% 0;} }
    .porcentagem {
        margin-top: 8px;
        font-size: 12px; letter-spacing: 4px; font-weight: 700;
        color: rgba(255, 170, 170, 0.9);
        text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    /* ============ PLAYER DE MÚSICA ============ */
    .player {
        position: fixed; z-index: 12;
        bottom: 22px; left: 24px;
        display: flex; align-items: center; gap: 10px;
        background: rgba(20, 2, 2, 0.7);
        border: 1px solid rgba(255, 60, 60, 0.45);
        padding: 8px 14px; border-radius: 999px;
        backdrop-filter: blur(6px);
    }
    .player button {
        background: none; border: none; cursor: pointer;
        font-size: 18px; color: #fff;
    }
    .player input[type=range] { width: 90px; accent-color: #d90000; cursor: pointer; }
    .nota { animation: girar 3s linear infinite; display: inline-block; }
    @keyframes girar { 0%{transform:rotate(0);} 100%{transform:rotate(360deg);} }

    .discord-rodape {
        position: fixed; z-index: 12;
        bottom: 26px; right: 24px;
        background: rgba(20, 2, 2, 0.7);
        border: 1px solid rgba(255, 60, 60, 0.45);
        padding: 8px 14px; border-radius: 999px;
        backdrop-filter: blur(6px);
        font-size: 13px; letter-spacing: 1px;
        color: rgba(255,255,255,0.85);
    }
    .discord-rodape b { color: #ff5c5c; }
</style>
</head>
<body>

    <div class="reserva"></div>
    <div class="fundo"></div>
    <div class="vinheta"></div>

    <!-- Neblina -->
    <div class="neblina n1"></div>
    <div class="neblina n2"></div>

    <!-- Helicóptero cruzando o céu -->
    <svg class="heli" viewBox="0 0 100 40">
        <g fill="#0a0202">
            <ellipse cx="38" cy="22" rx="22" ry="10"/>
            <rect x="55" y="19" width="34" height="5" rx="2"/>
            <polygon points="88,12 94,12 92,26 86,26"/>
            <rect x="14" y="8" width="48" height="3" rx="1.5"/>
            <rect x="36" y="3" width="3" height="8"/>
            <rect x="24" y="31" width="30" height="3" rx="1.5"/>
            <rect x="28" y="28" width="3" height="5"/>
            <rect x="48" y="28" width="3" height="5"/>
        </g>
        <circle class="luz-heli" cx="38" cy="33" r="2.5" fill="#ff2222"/>
    </svg>

    <!-- Reflexo de luz no carro -->
    <div class="reflexo"></div>

    <!-- Barra de carregamento (em cima da da arte) -->
    <div class="area-loading">
        <div class="barra-fundo"><div class="barra" id="barra"></div></div>
        <div class="porcentagem" id="porcentagem">0%</div>
    </div>

    <!-- Player de música -->
    <div class="player">
        <span class="nota">🎵</span>
        <button id="btnSom" title="Ligar/desligar som">🔊</button>
        <input type="range" id="volume" min="0" max="100" value="40">
    </div>

    <div class="discord-rodape">💬 <b>discord.gg/seu-discord</b></div>

    <!-- MÚSICA: coloque um arquivo musica.mp3 nesta pasta! -->
    <audio id="musica" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

<script>
    // ===== Luzes da cidade piscando =====
    const coresLuz = ['#ff6b6b', '#ffffff', '#ffb3b3', '#d90000'];
    for (let i = 0; i < 28; i++) {
        const l = document.createElement('div');
        l.className = 'luz';
        const t = Math.random() * 2.5 + 1.5;
        const cor = coresLuz[Math.floor(Math.random() * coresLuz.length)];
        l.style.width = t + 'px'; l.style.height = t + 'px';
        // concentra nas laterais/baixo
        const lado = Math.random();
        l.style.left = lado < 0.4 ? (Math.random() * 22) + 'vw'
                     : lado < 0.8 ? (72 + Math.random() * 26) + 'vw'
                     : (Math.random() * 100) + 'vw';
        l.style.top = (45 + Math.random() * 50) + 'vh';
        l.style.background = cor;
        l.style.boxShadow = `0 0 ${t * 3}px ${cor}`;
        l.style.animationDuration = (Math.random() * 4 + 2) + 's';
        l.style.animationDelay = (Math.random() * 4) + 's';
        document.body.appendChild(l);
    }

    // ===== Música =====
    const musica = document.getElementById('musica');
    const btnSom = document.getElementById('btnSom');
    const volume = document.getElementById('volume');
    musica.volume = 0.4;
    const tocar = () => musica.play().catch(() => {});
    tocar();
    document.addEventListener('click', tocar, { once: true });
    btnSom.onclick = () => {
        musica.muted = !musica.muted;
        btnSom.textContent = musica.muted ? '🔇' : '🔊';
    };
    volume.oninput = () => { musica.volume = volume.value / 100; musica.muted = false; btnSom.textContent = '🔊'; };

    // ===== Barra de progresso =====
    const barra = document.getElementById('barra');
    const porcentagem = document.getElementById('porcentagem');
    let progresso = 0;
    (function avancar() {
        const restante = 95 - progresso;
        progresso += Math.random() * (restante * 0.08) + 0.3;
        if (progresso > 95) progresso = 95;
        const v = Math.floor(progresso);
        barra.style.width = v + '%';
        porcentagem.textContent = v + '%';
        setTimeout(avancar, 300 + Math.random() * 500);
    })();
</script>
</body>
</html>
